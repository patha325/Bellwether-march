name: Godot runtime tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit
      - name: Run runtime smoke and Ollama integration tests
        run: bash tests/run_runtime_tests.sh
